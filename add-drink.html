<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Kavya Annapareddy"/>
    <meta name="description" content="Mixology is a social media platform for drink enthusiasts to share their recipes with other passionate individuals."/>
    <title>Mixology - New Drink</title>
    <link rel="stylesheet" href="styles/base.css" />
    <script src="js/jquery-3.7.1.min.js"></script>
    <script src="js/scripts.js"></script>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="header-content">
                <form class="search-form" method="get" action="search-results.html">
                    <input type="text" class="search-bar" placeholder="Search..." name="query"/>
                    <input class="btn search-button" type="submit">
                        <img src="assets/icons/search.svg" alt="Search Icon" class="icon" />
                    </input>
                </form>
                <a class="profile" href="profile.html">
                    <img class="icon profile-icon" src="assets/icons/user.svg" alt="User Icon" />
                    <p>Username</p>
                </a>
            </div>
        </div>
        <nav>
            <div>
                <a class="logo-link" href="auth-index.html">
                    <img src="assets/logo-md.svg" alt="Logo" />
                    <h2 class="logo">Mixology</h2>
                </a>
                <div class="nav-links">
                    <ul>
                        <li>
                            <a href="auth-index.html">
                                <img src="assets/icons/home.svg" alt="Home Icon" class="icon" />
                                <p>Home</p>
                            </a>
                        </li>
                        <li>
                            <a class="active" href="add-drink.html">
                                <img src="assets/icons/new-post.svg" alt="New Post Icon" class="icon" />
                                <p>New Post</p>
                            </a>
                        </li>
                        <li>
                            <a href="profile.html">
                                <img src="assets/icons/profile.svg" alt="Profile Icon" class="icon" />
                                <p>Profile</p>
                            </a>
                        </li>
                        <li>
                            <a href="collections.html">
                                <img src="assets/icons/collections.svg" alt="Collections Icon" class="icon" />
                                <p>Collections</p>
                            </a>
                        </li>
                        <li>
                            <a href="settings.html">
                                <img src="assets/icons/settings.svg" alt="Settings Icon" class="icon" />
                                <p>Settings</p>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
            <div class="nav-footer">
                <div class="misc-links">
                    <a href="about.html">About</a>
                    <a href="#">
                        <img src="assets/icons/help.svg" alt="Help Icon" class="icon" />
                    </a>
                    <a href="contact.html">Contact</a>
                </div>
                <p class="copyright">&copy; 2025 Mixology.</p>
            </div>
        </nav>
        <div class="content">
            <div class="alert"></div>
            <div class="add-drink">
                <h1>New Drink</h1>
                <form class="add-drink-form" method="post" action="profile.html">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required><br><br>
    
                    <label for="description">Description:</label>
                    <textarea id="description" name="description" required></textarea><br><br>
    
                    <label for="ingredients">Ingredients:</label>
                    <ul id="ingredients"></ul>
                    <button type="button" class="btn" onclick="addIngridient()">Add Ingredient</button><br><br>
    
                    <label for="images">Upload Images:</label>
                    <input type="file" id="images" name="images" multiple><br><br>
    
                    <button type="button" class="btn">Cancel</button>
                    <button type="button" class="btn">Save to Draft</button>
                    <button type="submit" class="btn">Post</button>
                </form>
    
            </div>
            <footer>
                <a href="#top">Back to Top</a>
            </footer>
        </div>
    </div>
</body>

</html>
