<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mixology - Home</title>
    <link rel="stylesheet" href="styles/base-two.css" />
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="header-content">
                <!-- search bar form -->
                <form class="search-form">
                    <input type="text" class="search-bar" placeholder="Search..." />
                    <button class="btn search-button">
                        <img src="assets/icons/search.svg" alt="Search Icon" />
                    </button>
                </form>
                <div class="profile">
                    <img class="profile-icon" src="assets/user-48.png" alt="User Icon" />
                    <a class="profile-link" href="profile.html">Username</a>
                </div>
            </div>
        </div>
        <nav class="sidebar">
            <div>
                <a class="logo-link" href="index.html">
                    <img src="assets/logo-md.svg" alt="Logo" />
                    <h2 class="logo">Mixology</h2>
                </a>
                <div class="nav-links">
                    <ul>
                        <li>
                            <a class="active" href="index.html">
                                <img src="assets/icons/home.svg" alt="Home Icon" class="icon" />
                                <p>Home</p>
                            </a>
                        </li>
                        <li>
                            <a href="add-drink.html">
                                <img src="assets/icons/new-post.svg" alt="New Post Icon" class="icon" />
                                <p>New Post</p>
                            </a>
                        </li>
                        <li>
                            <a href="profile.html">
                                <img src="assets/icons/profile.svg" alt="Profile Icon" class="icon" />
                                <p>Profile</p>
                            </a>
                        </li>
                        <li>
                            <a href="collections.html">
                                <img src="assets/icons/collections.svg" alt="Collections Icon" class="icon" />
                                <p>Collections</p>
                            </a>
                        </li>
                        <li>
                            <a href="settings.html">
                                <img src="assets/icons/settings.svg" alt="Settings Icon" class="icon" />
                                <p>Settings</p>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
            <div class="misc-links">
                <a href="#">About</a>
                <a href="#">
                    <img src="assets/icons/help.svg" alt="Help Icon" class="icon" />
                </a>
                <a href="#">Contact</a>
            </div>
        </nav>
        <div class="content">
            <div class="tags-container">
                <h4>Filters</h4>
                <div class="btn tag">Tag 1</div>
                <div class="btn tag">Tag 2</div>
                <div class="btn tag">Tag 3</div>
                <div class="btn tag">Tag 4</div>
                <div class="btn tag">Tag 5</div>
            </div>
            <div class="cards-container">
                <!-- Post cards with image, title, user icon, and user link -->
                <div class="post-card">
                    <img class="post-image" src="assets/drink-1.jpg" alt="Drink Image" />
                    <div class="post-info">
                        <h3 class="post-title">Drink Title</h3>
                        <div class="user-info">
                            <img class="user-icon" src="assets/user-48.png" alt="User Icon" />
                            <a class="user-link" href="profile.html">Username</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
