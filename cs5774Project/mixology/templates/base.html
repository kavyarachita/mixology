{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Kavya Annapareddy"/>
    <meta name="description" content="Mixology is a social media platform for drink enthusiasts to share their recipes with other passionate individuals."/>
    <title>{% block title %}{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/base.css' %}" />
    {% block stylesheet %}{% endblock %}
    <script src="{% static 'js/jquery-3.7.1.min.js' %}"></script>
    <script src="{% static 'js/scripts.js' %}"></script>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="header-content">
                <form class="search-form" method="get" action="/search/">
                    <input type="text" class="search-bar" placeholder="Search..." name="query"/>
                    {% comment %} <input class="btn search-button" type="submit"/> {% endcomment %}
                    <button class="btn search-button" type="submit">
                        <img src="{% static 'assets/icons/search.svg' %}" alt="Search Icon" class="icon" />
                    </button>
                </form>
                <a class="profile" href="/profile">
                    <img class="icon profile-icon" src="{% static 'assets/icons/user.svg' %}" alt="User Icon" />
                    <p>Username</p>
                </a>
            </div>
        </div>
        <nav>
            <div>
                <a class="logo-link" href="/">
                    <img src="{% static 'assets/logo-md.svg' %}" alt="Logo" />
                    <h2 class="logo">Mixology</h2>
                </a>
                <div class="nav-links">
                    <ul>
                        {% for url in nav_urls %}
                            <li>
                                <a href="{{ url.href }}" {% if url.active %} class="active"{% endif %}>
                                    <img src="{% static 'assets/icons/' %}{{ url.icon }}" alt="{{ url.alt }}" class="icon" />
                                    <p>{{ url.name }}</p>
                                </a>
                            </li>
                        {% endfor %}
                    </ul>
                </div>
            </div>
            <div class="nav-footer">
                <div class="misc-links">
                    <a href="/about">About</a>
                    <a href="#">
                        <img src="{% static 'assets/icons/help.svg' %}" alt="Help Icon" class="icon" />
                    </a>
                    <a href="/contact">Contact</a>
                </div>
                <p class="copyright">&copy; 2025 Mixology.</p>
            </div>
        </nav>
        <div class="content">
            <div class="alert"></div>
            {% block content %}{% endblock %}
            <footer>
                <a href="#top">Back to Top</a>
            </footer>
        </div>
    </div>
</body>

</html>
