{% extends '../base.html' %}
{% load static %}

{% block title %} Mixology - Add Drink {% endblock %}
{% block stylesheet %}<link rel="stylesheet" href="{% static 'css/add-drink.css' %}" />{% endblock %}
{% block alert %}{% endblock %}
{% block content %}
<div class="add-drink">
    <h1>New Drink</h1>
    <form class="add-drink-form" method="post" action="/save-drink/">
        {% csrf_token %}
        <input type="hidden" name="slug" value="drink-0">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required><br><br>

        <label for="description">Description:</label>
        <textarea id="description" name="description" required></textarea><br><br>

        <label for="ingredients">Ingredients:</label>
        <ul id="ingredients"></ul>
        <button type="button" class="btn">Add Ingredient</button><br><br>

        <label for="images">Upload Images:</label>
        <input type="file" id="images" name="images" multiple><br><br>

        <button type="button" class="btn">Cancel</button>
        <button type="button" class="btn">Save to Draft</button>
        <button type="submit" class="btn">Post</button>
    </form>

</div>
{% endblock %}
