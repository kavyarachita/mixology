{% extends '../base.html' %}
{% load static %}

{% block title %} Mixology - Add Drink {% endblock %}
{% block stylesheet %}<link rel="stylesheet" href="{% static 'css/drink.css' %}" />{% endblock %}
{% block scripts %}
<script src="{% static 'js/drink-form.js' %}"></script>
{% endblock %}
{% block content %}
<div class="add-drink">
    <h1>New Drink</h1>
    <form class="add-drink-form" method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="description">Description:</label>
        <textarea id="description" name="description" required></textarea>

        <label for="ingredients">Ingredients:</label>
        <ul id="ingredients"></ul>
        <button onclick="addIngredient()" type="button" class="btn">Add Ingredient</button>

        <label for="instructions">Instructions:</label>
        <textarea id="instructions" name="instructions" required></textarea>

        <label for="images">Upload Images:</label>
        <input type="file" id="image" name="image">
        <br>
        <div class="submit-btns">
            <button type="button" class="btn">Save to Draft</button>
            <button type="submit" class="btn btn-secondary" name="submit" value="Save">Post</button>
        </div>
        <br>
        <a class="btn warning" href="/">Cancel</a>

    </form>

</div>
{% endblock %}
