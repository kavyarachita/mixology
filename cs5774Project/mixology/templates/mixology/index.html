{% extends '../base.html' %}
{% load static %}

{% block title %} Mixology - Home {% endblock %}

{% block content %}
    <div class="home-feed-container">
        <h1>Home</h1>
        <div class="cards-container">
            {% for drink in feed_drinks %}
                <div class="card" href="/drink/{{ drink.slug }}">
                    <img class="card-img" src="{% static drink.get_image_url %}" alt="Drink Image" />
                    <div class="card-content">
                    <h2>{{ drink.name }}</h2>
                    <a class="user-info" href="/profile/{{ drink.poster.slug }}">
                        <img
                        class="icon user-icon"
                        src="{% static 'assets/icons/user.svg' %}"
                        alt="User Icon"
                        />
                        <p>{{ drink.poster }}</p>
                    </a>
                    <div class="view-more"><a href="/drink/{{ drink.slug }}">View More &rarr;</a></div>
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>
{% endblock %}
