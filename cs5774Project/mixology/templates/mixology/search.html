{% extends '../base.html' %}
{% load static %}
{% load humanize %}

{% block title %} Mixology - Search {% endblock %}
{% block content %}
<div class="results-container">
    <h1>Search Results for {{ query }}</h1>
    <div class="results cards-container">
        {% for drink in search_results %}
            <div class="card" href="/drink/{{ drink.id }}">
                <img class="card-img" src="{{ drink.get_image_url }}" alt="Drink Image" />
                <div class="card-content">
                <h2>{{ drink.name }}</h2>
                <a class="user-info" href="/profile/{{ drink.poster.user.username }}">
                    <img
                    class="icon user-icon"
                    src="{{ drink.poster.get_pfp_url }}"
                    alt="User Icon"
                    />
                    <p>{{ drink.poster.username }}</p>
                </a>
                <div class="view-more">
                    <a href="/drink/{{ drink.id }}">
                        View More &rarr;
                      </a>
                </div>
                </div>
            </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
