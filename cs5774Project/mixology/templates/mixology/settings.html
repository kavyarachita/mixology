{% extends '../base.html' %}
{% load static %}

{% block title %} Mixology - Settings {% endblock %}
{% block content %}
<div class="settings-container">
    <h1>Settings</h1>
    <form class="settings-form" method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" value="{{ user.profile.name }}">
        <label for="bio">Bio:</label>
        <textarea id="bio" name="bio">{{ user.profile.bio }}</textarea>
        <label for="pfp">Profile Picture:</label>
        <img id="profile-img" src="{{ user.profile.get_pfp_url }}" alt="Profile Image" />
        <input type="file" id="pfp" name="pfp">
        <button class="btn" type="submit">Save Changes</button>
    </form>
</div>
{% endblock %}
