<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Kavya Annapareddy"/>
    <meta name="description" content="Mixology is a social media platform for drink enthusiasts to share their recipes with other passionate individuals."/>
    <title>Mixology - Explore</title>
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/index.css" />
    <script src="js/jquery-3.7.1.min.js"></script>
    <script src="js/scripts.js"></script>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="header-content">
                <form class="search-form" method="get" action="search-results.html">
                    <input type="text" class="search-bar" placeholder="Search..." name="query"/>
                    <input class="btn search-button" type="submit">
                        <img src="assets/icons/search.svg" alt="Search Icon" class="icon" />
                    </input>
                </form>
                <div class="login-btns">
                    <a class="btn btn-secondary" href="auth-index.html">Login</a>
                    <a class="btn btn-secondary" href="auth-index.html">Sign Up</a>
                </div>
            </div>
        </div>
        <nav>
            <div>
                <a class="logo-link" href="index.html">
                    <img src="assets/logo-md.svg" alt="Logo" />
                    <h2 class="logo">Mixology</h2>
                </a>
                <div class="login-container">
                    <form class="nav-login-form">
                      <input type="text" placeholder="Username" />
                      <input type="password" placeholder="Password" />
                      <a class="btn" href="auth-index.html">Login</a>
                    </form>
                    <p>Don't have an account?</p>
                    <button class="btn">Sign Up</button>
                </div>
            </div>
            <div class="nav-footer">
                <div class="misc-links">
                    <a href="about.html">About</a>
                    <a href="#">
                        <img src="assets/icons/help.svg" alt="Help Icon" class="icon" />
                    </a>
                    <a href="contact.html">Contact</a>
                </div>
                <p class="copyright">&copy; 2025 Mixology.</p>
            </div>
        </nav>
        <div class="content">
            <div class="tags-container">
                <h4>Filters</h4>
                <div class="btn tag">
                    <p>Tag 1</p>
                    <img src="assets/icons/close.svg" alt="Deselect Filter Icon"/> 
                </div>
                <div class="btn tag">
                    <p>Tag 2</p>
                    <img src="assets/icons/close.svg" alt="Deselect Filter Icon"/>
                </div>
                <div class="btn tag selected">
                    <p>Tag 3</p>
                    <img src="assets/icons/close.svg" alt="Deselect Filter Icon"/> 
                </div>
                <div class="btn tag selected">
                    <p>Tag 4</p>
                    <img src="assets/icons/close.svg" alt="Deselect Filter Icon"/>
                </div>
            </div>
            <div class="alert"></div>
            <div class="cards-container">
                <div class="card" href="drink.html">
                    <img class="card-img" src="assets/drink-6.jpg" alt="Drink Image" />
                    <div class="card-content">
                    <h2>Matcha Latte</h2>
                    <a class="user-info" href="other-profile.html">
                        <img
                        class="icon user-icon"
                        src="assets/icons/user.svg"
                        alt="User Icon"
                        />
                        <p>Wanda Maximoff</p>
                    </a>
                    <div class="view-more"><a href="drink.html">View More &rarr;</a></div>
                    </div>
                </div>
                <div class="card" href="drink.html">
                    <img class="card-img" src="assets/drink-2.jpg" alt="Drink Image" />
                    <div class="card-content">
                    <h2>Hot Chocolate</h2>
                    <a class="user-info" href="other-profile.html">
                        <img
                        class="icon user-icon"
                        src="assets/icons/user.svg"
                        alt="User Icon"
                        />
                        <p>Wanda Maximoff</p>
                    </a>
                    <div class="view-more"><a href="drink.html">View More &rarr;</a></div>
                    </div>
                </div>
                <div class="card" href="drink.html">
                    <img class="card-img" src="assets/drink-3.jpg" alt="Drink Image" />
                    <div class="card-content">
                    <h2>Lemonade</h2>
                    <a class="user-info" href="other-profile.html">
                        <img
                        class="icon user-icon"
                        src="assets/icons/user.svg"
                        alt="User Icon"
                        />
                        <p>Wanda Maximoff</p>
                    </a>
                    <div class="view-more"><a href="drink.html">View More &rarr;</a></div>
                    </div>
                </div>
            </div>
            <footer>
                <a href="#top">Back to Top</a>
            </footer>
        </div>
    </div>
</body>

</html>
