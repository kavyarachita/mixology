<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Kavya Annapareddy"/>
    <meta name="description" content="Mixology is a social media platform for drink enthusiasts to share their recipes with other passionate individuals."/>
    <title>Mixology - Explore</title>
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/index.css" />
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="header-content">
                <!-- search bar form -->
                <form class="search-form">
                    <input type="text" class="search-bar" placeholder="Search..." />
                    <button class="btn search-button">
                        <img src="assets/icons/search.svg" alt="Search Icon" class="icon" />
                    </button>
                </form>
                <a class="profile" href="profile.html">
                    <img class="profile-icon" src="assets/user-48.png" alt="User Icon" />
                    <p>Username</p>
                </a>
            </div>
        </div>
        <nav>
            <div>
                <a class="logo-link" href="index.html">
                    <img src="assets/logo-md.svg" alt="Logo" />
                    <h2 class="logo">Mixology</h2>
                </a>
                <div class="login-container">
                    <form>
                      <input type="text" placeholder="Username" />
                      <input type="password" placeholder="Password" />
                      <a class="btn" href="auth-index.html">Login</a>
                    </form>
                    <p>Don't have an account?</p>
                    <button class="btn">Sign Up</button>
                </div>
            </div>
            <div class="nav-footer">
                <div class="misc-links">
                    <a href="#">About</a>
                    <a href="#">
                        <img src="assets/icons/help.svg" alt="Help Icon" class="icon" />
                    </a>
                    <a href="#">Contact</a>
                </div>
                <p class="copyright">&copy; 2025 Mixology.</p>
            </div>
        </nav>
        <div class="content">
            <div class="tags-container">
                <h4>Filters</h4>

                    <p>Tag 1</p>

                    <p>Tag 4</p>
                    <img src="assets/icons/close.svg" alt="Deselect Filter Icon"/>

            </div>
            <div class="cards-container">
                <div class="card" href="drink.html">

                    <div class="card-content">
                      <h2>Matcha Latte</h2>
