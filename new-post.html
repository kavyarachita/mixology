<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mixology - New Post</title>
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/new-post.css" />
</head>

<body>
    <div class="container">
        <div class="sidebar">
            <nav>
                <div class="logo-link">
                    <img src="assets/logo-md.svg" alt="Logo" />
                    <h2 class="logo">Mixology</h2>
                </div>
                <div class="user-nav">
                    <img class="logo" src="assets/user-48.png" alt="User Icon" />
                    <p>Username</p>
                </div>
                <div class="new-post">
                    <a class="tab" href="new-post.html">Add Drink</a>
                </div>
                <ul>
                    <li><a href="auth-index.html">Home</a></li>
                    <li><a href="profile.html">Profile</a></li>
                    <li><a href="collections.html">Collections</a></li>
                    <li><a href="settings.html">Settings</a></li>
                </ul>
                <a class="tab logout" href="index.html">Logout</a>
                <a href="#">Help</a>
            </nav>
        </div>
        <div class="horizontal-nav">
            <nav>
                <img class="logo" src="assets/logo-md.svg" alt="Logo" />
                <div class="new-post">
                    <a class="tab" href="new-post.html">Add Drink</a>
                </div>
                <ul>
                    <li><a href="auth-index.html">Home</a></li>
                    <li><a href="profile.html">Profile</a></li>
                    <li><a href="collections.html">Collections</a></li>
                    <li><a href="settings.html">Settings</a></li>
                </ul>
                <a class="tab logout" href="index.html">Logout</a>
            </nav>
        </div>
        <main class="new-post content-container">
            <h2>New Drink</h2>
            <form>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required><br><br>

                <label for="description">Description:</label>
                <textarea id="description" name="description" required></textarea><br><br>

                <label for="ingredients">Ingredients:</label>
                <ul id="ingredients">
                    <li>
                        <input type="text" name="ingredient" required>
                        <button type="button">Delete</button>
                    </li>
                </ul>
                <button type="button">Add Ingredient</button><br><br>

                <label for="images">Upload Images:</label>
                <input type="file" id="images" name="images" multiple><br><br>

                <button type="button">Cancel</button>
                <button type="button">Save to Draft</button>
                <button type="submit">Post</button>
            </form>
        </main>

        </main>
    </div>
</body>

</html>
