<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Kavya Annapareddy"/>
    <meta name="description" content="Mixology is a social media platform for drink enthusiasts to share their recipes with other passionate individuals."/>
    <title>Mixology - My Profile</title>
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/profile.css" />
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="header-content">
                <form class="search-form">
                    <input type="text" class="search-bar" placeholder="Search..." />
                    <button class="btn search-button">
                        <img src="assets/icons/search.svg" alt="Search Icon" class="icon" />
                    </button>
                </form>
                <a class="profile" href="profile.html">
                    <img class="profile-icon" src="assets/user-48.png" alt="User Icon" />
                    <p>Username</p>
                </a>
            </div>
        </div>
        <nav>
            <div>
                <a class="logo-link" href="auth-index.html">
                    <img src="assets/logo-md.svg" alt="Logo" />
                    <h2 class="logo">Mixology</h2>
                </a>
                <div class="nav-links">
                    <ul>
                        <li>
                            <a href="auth-index.html">
                                <img src="assets/icons/home.svg" alt="Home Icon" class="icon" />
                                <p>Home</p>
                            </a>
                        </li>
                        <li>
                            <a href="add-drink.html">
                                <img src="assets/icons/new-post.svg" alt="New Post Icon" class="icon" />
                                <p>New Post</p>
                            </a>
                        </li>
                        <li>
                            <a class="active" href="profile.html">
                                <img src="assets/icons/profile.svg" alt="Profile Icon" class="icon" />
                                <p>Profile</p>
                            </a>
                        </li>
                        <li>
                            <a href="collections.html">
                                <img src="assets/icons/collections.svg" alt="Collections Icon" class="icon" />
                                <p>Collections</p>
                            </a>
                        </li>
                        <li>
                            <a href="settings.html">
                                <img src="assets/icons/settings.svg" alt="Settings Icon" class="icon" />
                                <p>Settings</p>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
            <div class="nav-footer">
                <div class="misc-links">
                    <a href="#">About</a>
                    <a href="#">
                        <img src="assets/icons/help.svg" alt="Help Icon" class="icon" />
                    </a>
                    <a href="#">Contact</a>
                </div>
                <p class="copyright">&copy; 2025 Mixology.</p>
            </div>
        </nav>
        <div class="content">
            <div class="profile-container">
                <div class="profile-header">
                    <img class="profile-image" src="assets/user-48.png" alt="User Icon" />
                    <h1 class="profile-name">Username</h1>
                    <p class="profile-bio">Bio</p>
                </div>
                <div class="profile-content">
                    <div class="profile-stats">
                        <div class="stat">
                            <p class="stat-number">0</p>
                            <p class="stat-label">Posts</p>
                        </div>
                        <div class="stat">
                            <p class="stat-number">0</p>
                            <p class="stat-label">Followers</p>
                        </div>
                        <div class="stat">
                            <p class="stat-number">0</p>
                            <p class="stat-label">Following</p>
                        </div>
                    </div>
                    <div class="cards-container">
                        <div class="card" href="drink.html">
                            <img class="card-img" src="assets/drink-6.jpg" alt="Drink Image" />
                            <div class="card-content">
                              <h2>Matcha Latte</h2>
                              <div class="view-more"><a href="drink.html">View More &rarr;</a></div>
                            </div>
                        </div>
                        <div class="card" href="drink.html">
                            <img class="card-img" src="assets/drink-6.jpg" alt="Drink Image" />
                            <div class="card-content">
                              <h2>Matcha Latte</h2>
                              <div class="view-more"><a href="drink.html">View More &rarr;</a></div>
                            </div>
                        </div>
                        <div class="card" href="drink.html">
                            <img class="card-img" src="assets/drink-6.jpg" alt="Drink Image" />
                            <div class="card-content">
                              <h2>Matcha Latte</h2>
                              <div class="view-more"><a href="drink.html">View More &rarr;</a></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <footer>
                <a href="#top">Back to Top</a>
                
            </footer>
        </div>
    </div>
</body>

</html>
