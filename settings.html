<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mixology - Settings</title>
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/settings.css" />
  </head>
  <body>
    <div class="container">
      <div class="sidebar">
        <nav>
          <div class="logo-link">
            <img src="assets/logo-md.svg" alt="Logo" />
            <h2 class="logo">Mixology</h2>
          </div>
          <div class="user-nav">
            <img class="logo" src="assets/user-48.png" alt="User Icon" />
            <p>Username</p>
          </div>
          <div class="new-post">
            <a class="tab" href="new-post.html">Add Drink</a>
          </div>
          <ul>
            <li><a href="auth-index.html">Home</a></li>
            <li><a href="profile.html">Profile</a></li>
            <li><a href="collections.html">Collections</a></li>
            <li><a class="active" href="settings.html">Settings</a></li>
          </ul>
          <a class="tab logout" href="index.html">Logout</a>
          <a href="#">Help</a>
        </nav>
      </div>
      <div class="horizontal-nav">
        <nav>
          <img class="logo" src="assets/logo-md.svg" alt="Logo" />
          <div class="new-post">
            <a class="tab" href="new-post.html">Add Drink</a>
          </div>
          <ul>
            <li><a href="auth-index.html">Home</a></li>
            <li><a href="profile.html">Profile</a></li>
            <li><a href="collections.html">Collections</a></li>
            <li><a class="active" href="settings.html">Settings</a></li>
          </ul>
          <a class="tab logout" href="index.html">Logout</a>
        </nav>
      </div>
      <main class="settings content-container">
        <h2>Settings</h2>
        <p>Manage your preferences here.</p>
        <form>
          <h3>General Settings</h3>
          <div>
            <label for="name">Name:</label>
            <input
              type="text"
              id="name"
              name="name"
              placeholder="Enter your name"
            />
          </div>

          <div>
            <label for="email">Email:</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Enter your email"
            />
          </div>

          <div>
            <label for="password">Password:</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter your password"
            />
          </div>

          <h3>Notification Settings</h3>
          <div>
            <label for="notifications">Receive notifications:</label>
            <input type="checkbox" id="notifications" name="notifications" />
          </div>

          <div>
            <label for="frequency">Notification frequency:</label>
            <select id="frequency" name="frequency">
              <option value="daily">Daily</option>
              <option value="weekly">Weekly</option>
              <option value="monthly">Monthly</option>
            </select>
          </div>

          <h3>Privacy Settings</h3>
          <div>
            <label for="publicProfile">Public profile:</label>
            <input type="checkbox" id="publicProfile" name="publicProfile" />
          </div>

          <div>
            <label for="allowMessages">Allow messages:</label>
            <input type="checkbox" id="allowMessages" name="allowMessages" />
          </div>

          <button type="submit">Save</button>
        </form>
      </main>
    </div>
  </body>
</html>
