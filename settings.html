<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Kavya Annapareddy"/>
    <meta name="description" content="Mixology is a social media platform for drink enthusiasts to share their recipes with other passionate individuals."/>
    <title>Mixology - Settings</title>
    <link rel="stylesheet" href="styles/base.css" />
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="header-content">
                <form class="search-form">
                    <input type="text" class="search-bar" placeholder="Search..." />
                    <button class="btn search-button">
                        <img src="assets/icons/search.svg" alt="Search Icon" class="icon" />
                    </button>
                </form>
                <a class="profile" href="profile.html">
                    <img class="profile-icon" src="assets/user-48.png" alt="User Icon" />
                    <p>Username</p>
                </a>
            </div>
        </div>
        <nav>
            <div>
                <a class="logo-link" href="auth-index.html">
                    <img src="assets/logo-md.svg" alt="Logo" />
                    <h2 class="logo">Mixology</h2>
                </a>
                <div class="nav-links">
                    <ul>
                        <li>
                            <a href="auth-index.html">
                                <img src="assets/icons/home.svg" alt="Home Icon" class="icon" />
                                <p>Home</p>
                            </a>
                        </li>
                        <li>
                            <a href="add-drink.html">
                                <img src="assets/icons/new-post.svg" alt="New Post Icon" class="icon" />
                                <p>New Post</p>
                            </a>
                        </li>
                        <li>
                            <a href="profile.html">
                                <img src="assets/icons/profile.svg" alt="Profile Icon" class="icon" />
                                <p>Profile</p>
                            </a>
                        </li>
                        <li>
                            <a href="collections.html">
                                <img src="assets/icons/collections.svg" alt="Collections Icon" class="icon" />
                                <p>Collections</p>
                            </a>
                        </li>
                        <li>
                            <a class="active" href="settings.html">
                                <img src="assets/icons/settings.svg" alt="Settings Icon" class="icon" />
                                <p>Settings</p>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
            <div class="nav-footer">
                <div class="misc-links">
                    <a href="#">About</a>
                    <a href="#">
                        <img src="assets/icons/help.svg" alt="Help Icon" class="icon" />
                    </a>
                    <a href="#">Contact</a>
                </div>
                <p class="copyright">&copy; 2025 Mixology.</p>
            </div>
        </nav>
        <div class="content">
            <div class="settings-container">
                <h1>Settings</h1>
                <form class="setings-form">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Username" />
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Email" />
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Password" />
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm Password" />
                    <button class="btn">Save Changes</button>
                </form>
            </div>
            <footer>
                <a href="#top">Back to Top</a>
                
            </footer>
        </div>
    </div>
</body>

</html>
